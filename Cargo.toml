[workspace]
members = [".", "netui-ebpf"]
resolver = "2"

[package]
name = "netui"
version = "0.1.1"
authors = ["yousfi saad <yousfi.saad@gmail.com>"]
edition = "2021"
keywords = ["cli", "tui", "network", "monitor", "ARP"]
license-file = "license.txt"
repository = "https://github.com/yousfiSaad/netui.git"
description = "NetUI is a Rust-based tui designed to monitor network interfaces. It allows you to send ARP messages via the network interface and listen for packets to show bandwidth stats."

[dependencies]
chrono = "0.4.39"
clap = { version = "4.5.34", features = ["derive"] }
color-eyre = "0.6.3"
crossterm = { version = "0.28.1", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.31"
itertools = "0.14.0"
lazy_static = "1.5.0"
pnet = { version = "0.35.0", optional = true }
pnet_datalink = { version = "0.35.0", optional = true }
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }
ratatui = "0.29.0"
ringbuf = "0.4.7"
tokio = { version = "1.40.0", features = ["full"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-width = "0.2.0"

[features]
default = ["pnet-backend"]
pnet-backend = ["pnet", "pnet_datalink"]
ebpf-backend = ["aya", "aya-log"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }

[build-dependencies]
anyhow = "1"
aya-build = { version = "0.1.3", default-features = false }

[[bin]]
name = "netui"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

