name: Rust

on:
  push:
    branches: [ "releases" ]
  pull_request:
    branches: [ "releases" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --no-default-features --features pnet-backend
    - name: Run tests
      run: cargo test --verbose --no-default-features --features pnet-backend
